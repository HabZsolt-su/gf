<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe4e6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Anniversary Gallery 💕</title>
  
  <!-- Link to manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Romantic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">

  <!-- Keep these two (Firebase App & Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Firebase Storage script removed as requested -->
</head>
<body>
  <!-- Romantic Floating Ambient Hearts -->
  <div class="ambient-hearts" aria-hidden="true" id="ambientHearts"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="heart-badge">❤️ Anniversary Memories</div>
      <h1 class="header-title">Our Love Story</h1>
      <p class="header-subtitle" id="memoryCounter">Capturing our favorite moments together</p>
      
      <!-- Connection Status indicator -->
      <div class="status-pill connected" id="statusPill" title="Connection status">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Firestore Cloud Synced</span>
      </div>
    </div>
  </header>

  <!-- Main Container: Strict 2-Column Grid -->
  <main class="gallery-container">
    <div class="gallery-grid" id="galleryGrid">
      <!-- Loading Skeleton Cards -->
      <div class="photo-card memory-card skeleton-card">
        <div class="skeleton-img"></div>
        <div class="card-caption-area">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>
      <div class="photo-card memory-card skeleton-card">
        <div class="skeleton-img"></div>
        <div class="card-caption-area">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">📸</div>
      <h3>No Memories Yet</h3>
      <p>Tap the <strong>Add Photo</strong> button below to capture and share your first romantic memory!</p>
    </div>
  </main>

  <!-- Fixed 'Add Photo' Floating Action Bar -->
  <div class="fixed-action-bar">
    <button id="addPhotoBtn" class="add-photo-btn" aria-label="Add new photo">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </span>
      <span class="btn-text">Add Photo</span>
      <span class="btn-sparkle">✨</span>
    </button>
  </div>

  <!-- Native file input with id="imageInput" for camera roll / photo selection -->
  <input type="file" id="imageInput" accept="image/*" class="sr-only" aria-hidden="true">

  <!-- Upload Modal / Sheet -->
  <div class="modal-backdrop" id="uploadModal" aria-hidden="true">
    <div class="upload-sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <div class="sheet-handle"></div>
      
      <div class="sheet-header">
        <h2 id="uploadTitle">Add a Memory 💖</h2>
        <button class="close-sheet-btn" id="closeUploadModal" aria-label="Close">&times;</button>
      </div>

      <div class="sheet-body">
        <!-- Selected Image Preview -->
        <div class="preview-container" id="previewContainer">
          <img id="imagePreview" src="" alt="Selected Memory Preview">
          <button class="change-photo-btn" id="changePhotoBtn" type="button">Change Photo</button>
        </div>

        <!-- Form fields -->
        <form id="uploadForm" class="upload-form">
          <div class="form-group">
            <label for="captionInput">Caption / Love Note (optional)</label>
            <textarea id="captionInput" placeholder="Write something sweet about this moment... 💕" rows="2" maxlength="300"></textarea>
          </div>

          <!-- Upload Progress -->
          <div class="progress-wrap" id="progressWrap" style="display: none;">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
            </div>
            <div class="progress-label" id="progressLabel">Saving to Firestore... 💫</div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="cancelUploadBtn">Cancel</button>
            <button type="submit" class="btn-upload" id="submitUploadBtn">
              <span>Save Memory</span> ❤️
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close viewer">&times;</button>
    <div class="lightbox-content">
      <div class="lightbox-image-wrap">
        <img id="lightboxImg" src="" alt="Enlarged memory">
      </div>
      <div class="lightbox-details">
        <span class="lightbox-date" id="lightboxDate"></span>
        <p class="lightbox-caption" id="lightboxCaption"></p>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toastNotification" aria-live="polite"></div>

  <!-- Firebase Configuration & Application Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Real-time listener to load photos automatically on both phones
    db.collection('photos').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        const grid = document.getElementById('galleryGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        snapshot.forEach(doc => {
            const data = doc.data();
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            // Explicitly set the image source and force a reload trigger
            card.innerHTML = `<img src="${data.image}" alt="Anniversary Memory" style="display: block; width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">`;
            
            // Optional tap to view full size
            card.addEventListener('click', () => {
                if (typeof window.openLightbox === 'function') {
                    window.openLightbox(data.image, 'Anniversary Memory', data.caption || '');
                }
            });

            grid.appendChild(card);
        });

        // Hide empty state if pictures exist
        const emptyState = document.getElementById('emptyState');
        const counter = document.getElementById('memoryCounter');
        if (emptyState) {
            emptyState.style.display = snapshot.empty ? 'block' : 'none';
        }
        if (counter && !snapshot.empty) {
            counter.textContent = `${snapshot.size} cherished memories together`;
        }
    });
  </script>
</body>
</html>
